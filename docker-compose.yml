services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Upstash's client speaks its REST API over HTTP, not the native Redis
  # protocol, so plain `redis` above isn't reachable from the app directly.
  # This proxies the REST API onto the real Redis instance for local dev.
  srh:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-dev-token
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: this image's busybox wget resolves
      # "localhost" to ::1 first and fails to connect even once the server
      # is listening on 0.0.0.0.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Local-only dummy credentials pointed at the srh shim, deliberately
      # not .env.local — a containerized run should never be able to reach
      # a real Upstash database.
      UPSTASH_REDIS_REST_URL: "http://srh:80"
      UPSTASH_REDIS_REST_TOKEN: "local-dev-token"
      # Harmless when the observability profile isn't running: the OTel SDK
      # just fails to export silently (no listener), same as any other
      # unset/unreachable OTLP target.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    depends_on:
      srh:
        condition: service_healthy
    healthcheck:
      # Hits /api/health, which itself calls redis.ping() through srh — a
      # bare TCP/process check would miss "process is up but can't reach
      # its dependency," which is exactly the failure mode this is for.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Local-only demo backend for the OTel data the app already emits — not a
  # production dependency, and not required for the app/redis/srh stack
  # above. Off by default; start explicitly with:
  #   docker compose --profile observability up
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "3001:3000"
    environment:
      # Local demo only: skip login for a zero-friction `open localhost:3001`.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
