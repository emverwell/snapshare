receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

# Derives request-latency and error-rate metrics directly from Next.js's own
# request spans (http.route, http.status_code) rather than from an
# instrumentation-http metric — that package's low-level Node http-module
# patching doesn't take effect under Next's standalone server, so it never
# records anything here, while Next's own spans work reliably regardless.
# This needs zero app-side code: it's derived entirely at the collector from
# traces the app was already emitting.
connectors:
  spanmetrics:
    dimensions:
      - name: http.route
      - name: http.status_code
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
    metrics_flush_interval: 15s

exporters:
  # Prometheus scrapes this collector rather than the app directly, so the
  # app never needs to know Prometheus exists — it only ever speaks OTLP.
  prometheus:
    endpoint: 0.0.0.0:8889
  # Traces have nowhere to render locally without adding a trace UI (Jaeger/
  # Tempo); logging them keeps traces genuinely working end-to-end without
  # that extra service.
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      exporters: [prometheus]
